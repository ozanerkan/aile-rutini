<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Küçük Kahraman Dünyası 🚀</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --purple: #bc84ee;
            --orange: #ff823a;
            --green: #2ecc71;
            --blue: #4cc9f0;
            --pink: #ff8e8e;
            --yellow: #f1c40f;
            --dark: #1e293b;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-color);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; user-select: none;
            min-height: 100vh;
            justify-content: flex-start;
        }

        .decor {
            position: fixed; font-size: 35px; opacity: 0.15; z-index: -1;
            animation: floatAnim 8s infinite ease-in-out;
        }
        @keyframes floatAnim {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        #loginScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #ffe5ec, #cdb4db);
            z-index: 9999; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-sizing: border-box;
        }
        .login-box {
            background: white; padding: 40px 30px; border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15); text-align: center; 
            max-width: 420px; width: 85%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-sizing: border-box;
        }
        .login-avatar { font-size: 80px; animation: bounce 2s infinite; margin-bottom: 15px; }
        .login-box h2 { font-family: 'Comfortaa', cursive; color: var(--dark); margin: 0 0 20px 0; font-size: 26px; }
        .login-input {
            width: 100%; padding: 15px; border: 3px solid #e2e8f0; border-radius: 15px;
            font-family: 'Quicksand', sans-serif; font-size: 18px; font-weight: bold; 
            text-align: center; outline: none; margin-bottom: 20px; box-sizing: border-box;
            transition: border-color 0.3s;
        }
        .login-input:focus { border-color: var(--purple); }
        .login-btn {
            font-family: 'Comfortaa', cursive; background: linear-gradient(135deg, var(--purple), var(--blue));
            color: white; border: none; padding: 15px; font-size: 18px; font-weight: bold; 
            border-radius: 50px; cursor: pointer; width: 100%; box-sizing: border-box;
            box-shadow: 0 5px 15px rgba(188, 132, 238, 0.4); transition: all 0.2s;
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(188, 132, 238, 0.6); }

        #appContent { display: none; width: 100%; max-width: 900px; }

        h1 { font-family: 'Comfortaa', cursive; color: var(--dark); text-align: center; margin-bottom: 5px; }

        .control-panel {
            display: flex; justify-content: space-between; width: 100%; margin-bottom: 15px; gap: 10px;
        }
        .mini-btn {
            background: white; border: 2px solid #e2e8f0; padding: 10px 15px; border-radius: 50px;
            cursor: pointer; font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 5px;
        }
        .mini-btn:hover { background: #f8fafc; }

        .header-card {
            background: white; padding: 20px; border-radius: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.03); margin-bottom: 25px; text-align: center;
        }
        .score-text { font-family: 'Comfortaa', cursive; font-size: 26px; font-weight: bold; color: var(--dark); margin-bottom: 10px; }
        .progress-container { background: #e2e8f0; border-radius: 50px; height: 25px; width: 100%; overflow: hidden; }
        .progress-bar { background: linear-gradient(90deg, var(--orange), var(--purple)); height: 100%; width: 0%; transition: width 0.4s; }

        .weekly-tracker {
            display: flex; justify-content: space-around; margin-top: 15px; background: #f8fafc; padding: 10px; border-radius: 15px;
        }
        .day-bubble { display: flex; flex-direction: column; align-items: center; font-size: 12px; font-weight: bold; color: #64748b; }
        .day-circle {
            width: 30px; height: 30px; border-radius: 50%; background: #e2e8f0; margin-top: 5px;
            display: flex; align-items: center; justify-content: center; color: white; font-size: 14px;
        }
        .day-circle.done { background: var(--green); }

        .category-container { margin-bottom: 30px; }
        .category-title {
            font-family: 'Comfortaa', cursive; font-size: 22px; color: var(--dark);
            margin-bottom: 15px; display: flex; align-items: center; gap: 10px;
        }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }

        .card { height: 160px; perspective: 1000px; cursor: pointer; position: relative; }
        .card-inner {
            position: relative; width: 100%; height: 100%; text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d;
        }
        .card.completed .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden;
            border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; box-sizing: border-box;
        }
        .card-front { background: white; border: 3px solid #e2e8f0; }
        .card-back { background: var(--green); color: white; transform: rotateY(180deg); }
        .card-emoji { font-size: 36px; margin-bottom: 5px; }
        .card-title { font-size: 14px; font-weight: 700; color: #334155; margin: 0; }
        .card-back .card-title { color: white; }
        .points-badge { background: #f1f5f9; color: var(--orange); padding: 2px 8px; border-radius: 50px; font-size: 11px; font-weight: bold; margin-top: 5px; }
        
        .delete-card-btn {
            position: absolute; top: -5px; right: -5px; background: var(--pink); color: white; border: none;
            width: 25px; height: 25px; border-radius: 50%; cursor: pointer; display: none; z-index: 10; font-weight: bold;
        }

        .card.locked { cursor: not-allowed; opacity: 0.3; }
        .card.locked .card-front { background: #cbd5e1; border-color: #94a3b8; }
        .lock-text { font-size: 10px; color: #ef4444; font-weight: bold; margin-top: 2px; }

        .creator-panel {
            background: white; padding: 20px; border-radius: 20px; margin-bottom: 20px;
            display: none; box-shadow: 0 10px 20px rgba(0,0,0,0.05); width: 100%; box-sizing: border-box;
        }
        .creator-panel input, .creator-panel select {
            padding: 10px; margin: 5px; border-radius: 10px; border: 2px solid #e2e8f0; font-family: inherit; font-size: 14px;
        }

        .action-bar { display: flex; justify-content: center; gap: 15px; margin-top: 30px; margin-bottom: 5px;}
        .action-btn {
            font-family: 'Comfortaa', cursive; padding: 12px 30px; border-radius: 50px; border: none; font-size: 16px; cursor: pointer; color: white; font-weight: bold;
        }

        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    </style>
</head>
<body>

    <div class="decor" style="top: 10%; left: 5%; animation-delay: 0s;">🎈</div>
    <div class="decor" style="top: 15%; right: 8%; animation-delay: 2s;">☁️</div>
    <div class="decor" style="bottom: 20%; left: 8%; animation-delay: 4s;">🦄</div>
    <div class="decor" style="bottom: 12%; right: 6%; animation-delay: 1s;">🧸</div>

    <div id="loginScreen">
        <div class="login-box">
            <div class="login-avatar">👶👑</div>
            <h2>Kahraman Dünyası</h2>
            <input type="text" id="childNameInput" class="login-input" placeholder="Adını Yaz Kahraman!" maxlength="12">
            <button class="login-btn" onclick="login()">Macera Başlasın! ✨</button>
        </div>
    </div>

    <div id="appContent">
        <div class="control-panel">
            <button class="mini-btn" onclick="toggleMusic()">🎵 Müzik: <span id="musicStatus">Kapat</span></button>
            <button class="mini-btn" onclick="toggleEditMode()">🛠️ Görevleri Düzenle</button>
        </div>

        <h1>👶 <span id="welcomeName">Kahraman</span>'ın Takvimi</h1>

        <div class="header-card">
            <div class="score-text">Bugünkü Puan: <span id="totalScore">0</span> / 60 ⭐</div>
            <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
            
            <div class="weekly-tracker">
                <div class="day-bubble">Pzt<div class="day-circle" id="day-1">⭐</div></div>
                <div class="day-bubble">Sal<div class="day-circle" id="day-2">⭐</div></div>
                <div class="day-bubble">Çar<div class="day-circle" id="day-3">⭐</div></div>
                <div class="day-bubble">Per<div class="day-circle" id="day-4">⭐</div></div>
                <div class="day-bubble">Cum<div class="day-circle" id="day-5">⭐</div></div>
                <div class="day-bubble">Cmt<div class="day-circle" id="day-6">⭐</div></div>
                <div class="day-bubble">Paz<div class="day-circle" id="day-0">⭐</div></div>
            </div>
        </div>

        <div class="creator-panel" id="creatorPanel">
            <h3>✨ Yeni Görev Ekle</h3>
            <input type="text" id="newTaskEmoji" placeholder="Emoji (Örn: 🥦)" style="width: 80px;">
            <input type="text" id="newTaskTitle" placeholder="Görev Adı (Örn: Sebze Yemek)">
            <input type="number" id="newTaskPoints" placeholder="Puan" style="width: 80px;" value="10">
            <select id="newTaskCat">
                <option value="morning">☀️ Sabah (06-10)</option>
                <option value="school">🎒 Okul (09:00+)</option>
                <option value="noon">🌈 Öğlen Rutini</option>
                <option value="evening">🌙 Akşam & Yatak</option>
            </select>
            <button class="mini-btn" style="background: var(--green); color: white; display: inline-block;" onclick="addNewTask()">Ekle ➕</button>
        </div>

        <div id="tasksContainer"></div>

        <div class="action-bar">
            <button class="action-btn" style="background: var(--pink);" onclick="resetDay()">Günü Sıfırla 🔄</button>
        </div>
    </div>

    <audio id="bgMusic" loop src="https://assets.mixkit.co/active_storage/sfx/1977/1977-84.wav"></audio>

    <script>
        let currentScore = 0;
        const TARGET_SCORE = 60;
        let isMusicPlaying = false;
        let editMode = false;

        // YENİDEN YAPILANDIRILMIŞ VE SAATLERİ DÜZELTİLMİŞ GÖREV LİSTESİ
        const defaultTasks = [
            // Sabah Grubu (06:00 - 10:00)
            { id: 1, cat: 'morning', emoji: '👁️', title: 'Uyanmak', pts: 5, timeLock: true },
            { id: 2, cat: 'morning', emoji: '🛏️', title: 'Yatak Yapmak', pts: 10, timeLock: true },
            { id: 3, cat: 'morning', emoji: '🍳', title: 'Kahvaltı Yapmak', pts: 15, timeLock: true },
            { id: 4, cat: 'morning', emoji: '🎒', title: 'Çanta Hazırlamak', pts: 10, timeLock: true },
            { id: 5, cat: 'morning', emoji: '💊', title: 'Vitamin / İlaç', pts: 10, timeLock: true },
            
            // Okul Grubu (09:00 Sonrası Kilit)
            { id: 6, cat: 'school', emoji: '🧸', title: 'Oyun Oynamak', pts: 10, schoolLock: true },
            { id: 7, cat: 'school', emoji: '🍲', title: 'Yemek Yemek', pts: 10, schoolLock: true },
            { id: 8, cat: 'school', emoji: '🍓', title: 'Ara Öğün Yemek', pts: 5, schoolLock: true },
            { id: 9, cat: 'school', emoji: '😴', title: 'Uyku Uyumak', pts: 15, schoolLock: true },
            { id: 10, cat: 'school', emoji: '🎨', title: 'Etkinliğe Katılmak', pts: 15, schoolLock: true },

            // Öğlen Grubu
            { id: 11, cat: 'noon', emoji: '🪥', title: 'Diş Fırçalamak', pts: 5 },
            { id: 12, cat: 'noon', emoji: '💧', title: 'Su İçmek', pts: 5 },
            
            // Akşam Grubu
            { id: 13, cat: 'evening', emoji: '🚽', title: 'Tuvalet Kontrolü', pts: 10 },
            { id: 14, cat: 'evening', emoji: '📖', title: 'Masal & Uyku', pts: 10 }
        ];

        let userTasks = [];

        window.onload = function() {
            const savedName = localStorage.getItem('heroName');
            if(savedName) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('appContent').style.display = 'block';
                document.getElementById('welcomeName').innerText = savedName;
                initApp();
            }
        };

        function login() {
            const name = document.getElementById('childNameInput').value.trim() || "Küçük Şef";
            localStorage.setItem('heroName', name);
            location.reload();
        }

        function initApp() {
            const savedTasks = localStorage.getItem('customTasks');
            userTasks = savedTasks ? JSON.parse(savedTasks) : defaultTasks;
            renderTasks();
            loadProgress();
            checkWeeklyHistory();
        }

        function renderTasks() {
            const container = document.getElementById('tasksContainer');
            container.innerHTML = '';

            const categories = {
                morning: { title: '☀️ Sabah Görevleri (06:00 - 10:00)', color: 'var(--orange)' },
                school: { title: '🎒 Okul Zamanı (09:00 Sonrası)', color: 'var(--purple)' },
                noon: { title: '🌈 Öğlen Rutini', color: 'var(--blue)' },
                evening: { title: '🌙 Akşam & Yatak Hazırlığı', color: 'var(--pink)' }
            };

            const currentHour = new Date().getHours();

            for (let key in categories) {
                const catTasks = userTasks.filter(t => t.cat === key);
                if(catTasks.length === 0) continue;

                let catHtml = `
                    <div class="category-container">
                        <div class="category-title" style="border-left: 5px solid ${categories[key].color}">${categories[key].title}</div>
                        <div class="grid">
                `;

                catTasks.forEach(task => {
                    let isLocked = false;
                    let lockReason = '';
                    
                    // Sabah saati kilidi
                    if(task.timeLock && (currentHour < 6 || currentHour >= 10)) {
                        isLocked = true;
                        lockReason = '🔒 Zamanı Geçti (06-10)';
                    }
                    // Okul saati kilidi (Sabah 9'dan önce kilitli)
                    if(task.schoolLock && currentHour < 9) {
                        isLocked = true;
                        lockReason = '🔒 Saat 09:00\'da Açılır';
                    }

                    catHtml += `
                        <div class="card ${isLocked ? 'locked' : ''}" id="task-${task.id}" data-pts="${task.pts}" onclick="clickCard(this, ${isLocked})">
                            <button class="delete-card-btn" onclick="deleteTask(event, ${task.id})">X</button>
                            <div class="card-inner">
                                <div class="card-front">
                                    <div class="card-emoji">${task.emoji}</div>
                                    <p class="card-title">${task.title}</p>
                                    <div class="points-badge">+${task.pts} Puan</div>
                                    ${isLocked ? `<div class="lock-text">${lockReason}</div>` : ''}
                                </div>
                                <div class="card-back">
                                    <div class="card-emoji">⭐</div>
                                    <p class="card-title">BAŞARDIN!</p>
                                </div>
                            </div>
                        </div>
                    `;
                });

                catHtml += `</div></div>`;
                container.innerHTML += catHtml;
            }
        }

        function clickCard(element, isLocked) {
            if(isLocked || editMode) return;
            
            const pts = parseInt(element.getAttribute('data-pts'));
            if(element.classList.contains('completed')) {
                element.classList.remove('completed');
                currentScore -= pts;
            } else {
                element.classList.add('completed');
                currentScore += pts;
            }
            
            updateScoreboard();
            saveProgress();
        }

        function updateScoreboard() {
            document.getElementById('totalScore').innerText = currentScore;
            let percent = (currentScore / TARGET_SCORE) * 100;
            if(percent > 100) percent = 100;
            document.getElementById('progressBar').style.width = percent + '%';

            const currentDay = new Date().getDay();
            const targetCircle = document.getElementById(`day-${currentDay}`);
            
            if(currentScore >= TARGET_SCORE) {
                if(targetCircle) targetCircle.classList.add('done');
                saveWeeklyHistory(currentDay, true);
            } else {
                if(targetCircle) targetCircle.classList.remove('done');
                saveWeeklyHistory(currentDay, false);
            }
        }

        function toggleMusic() {
            const music = document.getElementById('bgMusic');
            if(isMusicPlaying) {
                music.pause();
                document.getElementById('musicStatus').innerText = "Kapat";
            } else {
                music.play().catch(() => alert("Müziği başlatmak için ekrana dokunun!"));
                document.getElementById('musicStatus').innerText = "Açık 🎵";
            }
            isMusicPlaying = !isMusicPlaying;
        }

        function toggleEditMode() {
            editMode = !editMode;
            document.getElementById('creatorPanel').style.display = editMode ? 'block' : 'none';
            document.querySelectorAll('.delete-card-btn').forEach(btn => {
                btn.style.display = editMode ? 'block' : 'none';
            });
        }

        function addNewTask() {
            const emoji = document.getElementById('newTaskEmoji').value.trim() || "⭐";
            const title = document.getElementById('newTaskTitle').value.trim();
            const pts = parseInt(document.getElementById('newTaskPoints').value) || 10;
            const cat = document.getElementById('newTaskCat').value;

            if(!title) { alert("Lütfen görev adı yazın!"); return; }

            const newTask = {
                id: Date.now(),
                cat: cat,
                emoji: emoji,
                title: title,
                pts: pts,
                timeLock: cat === 'morning',
                schoolLock: cat === 'school'
            };

            userTasks.push(newTask);
            localStorage.setItem('customTasks', JSON.stringify(userTasks));
            
            document.getElementById('newTaskTitle').value = '';
            renderTasks();
            toggleEditMode();
        }

        function deleteTask(event, id) {
            event.stopPropagation();
            userTasks = userTasks.filter(t => t.id !== id);
            localStorage.setItem('customTasks', JSON.stringify(userTasks));
            renderTasks();
            toggleEditMode();
        }

        function saveProgress() {
            localStorage.setItem('score', currentScore);
            const completedIds = [];
            document.querySelectorAll('.card.completed').forEach(c => {
                completedIds.push(c.id);
            });
            localStorage.setItem('completedCards', JSON.stringify(completedIds));
        }

        function loadProgress() {
            const savedScore = localStorage.getItem('score');
            if(savedScore) {
                currentScore = parseInt(savedScore);
                updateScoreboard();
            }
            const completedIds = JSON.parse(localStorage.getItem('completedCards'));
            if(completedIds) {
                completedIds.forEach(id => {
                    const card = document.getElementById(id);
                    if(card) card.classList.add('completed');
                });
                updateScoreboard();
            }
        }

        function saveWeeklyHistory(day, isDone) {
            let history = JSON.parse(localStorage.getItem('weeklyHistory')) || {};
            history[day] = isDone;
            localStorage.setItem('weeklyHistory', JSON.stringify(history));
        }

        function checkWeeklyHistory() {
            let history = JSON.parse(localStorage.getItem('weeklyHistory')) || {};
            for(let day in history) {
                if(history[day]) {
                    const circle = document.getElementById(`day-${day}`);
                    if(circle) circle.classList.add('done');
                }
            }
        }

        function resetDay() {
            if(confirm('Bugünkü tüm kartları sıfırlamak istiyor musunuz?')) {
                localStorage.removeItem('score');
                localStorage.removeItem('completedCards');
                location.reload();
            }
        }
    </script>
</body>
</html>
